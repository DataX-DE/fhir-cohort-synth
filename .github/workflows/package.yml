name: Build offline packages

on:
  workflow_dispatch:
  push:
    branches: [main, 'packaging/**']
    paths:
      - 'fhir_cohort_synth/**'
      - 'fhir_synth.py'
      - 'pyproject.toml'
      - 'LICENSE'
      - 'packaging/**'
      - 'tools/*package.py'
      - 'tests/**'
      - 'examples/**'
      - '.github/workflows/package.yml'

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    # Standard hosted runners are free for public repositories. Do not consume
    # private-repository minutes; build locally while the repository is private.
    if: github.event.repository.private == false
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
            extension: zip
          - os: ubuntu-22.04
            target: linux-x64
            extension: tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      OFFLINE_TEST_IMAGE: ubuntu:22.04@sha256:2edbbc5dc405e9612ba3584ce95480277e3eb374407b5505fe26f17df77c7dbc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.15'
          architecture: x64
      - name: Install build tool
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r packaging/requirements-build.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Build native executable and archive
        run: python tools/build_package.py
      - name: Test extracted package
        shell: bash
        run: python tools/check_package.py dist/*-${{ matrix.target }}.${{ matrix.extension }}
      - name: Check Linux without Python or network
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p work/offline-package
          tar -xzf dist/*-linux-x64.tar.gz -C work/offline-package
          docker pull "$OFFLINE_TEST_IMAGE"
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD/work/offline-package,dst=/package,readonly" \
            "$OFFLINE_TEST_IMAGE" sh -c '
              test ! -x /usr/bin/python3 &&
              cd /package/fhir-cohort-synth-* &&
              ./fhir-cohort-synth run --input examples/mii-demo-bundle.json --output /tmp/example-output
            '
      - name: Upload checked archive and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fhir-cohort-synth-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
