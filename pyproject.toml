[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "fhir-cohort-synth"
version = "0.1.1"
description = "Offline FHIR ingestion and source-derived perturbation"
license = "MIT"
license-files = ["LICENSE", "packaging/licenses/FHIR-CC0.txt"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fhir-cohort-synth = "fhir_cohort_synth.cli:main"

[tool.setuptools.packages.find]
include = ["fhir_cohort_synth*"]

[tool.setuptools.package-data]
fhir_cohort_synth = ["data/*.json"]
